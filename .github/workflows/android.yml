# Builds the Play Store bundle (AAB) + APK for "Quero ser Streamer".
# Secrets (Settings > Secrets and variables > Actions):
#   GOOGLE_SERVICES_JSON        content of google-services.json (Firebase)
#   ANDROID_KEYSTORE_BASE64     upload keystore, base64
#   ANDROID_KEYSTORE_PASSWORD   keystore + key password
#   ADMOB_APP_ID / ADMOB_REWARDED_ID / ADMOB_INTERSTITIAL_ID   real AdMob ids
# Missing secrets fall back to: no Firebase, unsigned bundle, AdMob test ids.
name: Android

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web game into assets
        run: |
          npm ci
          npm run build

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set: building without Firebase"
          fi

      - name: AdMob ids
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          APP_ADS_PUB: pub-7483085200976329   # publisher in fefaofefao.github.io/app-ads.txt
        run: |
          f=android/app/src/main/res/values/ads.xml
          clean() { printf '%s' "$1" | tr -d ' \t\r\n"'"'"; }
          app=$(clean "$ADMOB_APP_ID"); rew=$(clean "$ADMOB_REWARDED_ID"); int=$(clean "$ADMOB_INTERSTITIAL_ID")
          if [ -z "$app$rew$int" ]; then echo "::warning::AdMob secrets not set: using Google test ids"; exit 0; fi
          [[ "$app" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]] || { echo "::error::ADMOB_APP_ID must look like ca-app-pub-0000000000000000~0000000000 (with ~)"; exit 1; }
          [[ "$rew" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]] || { echo "::error::ADMOB_REWARDED_ID must look like ca-app-pub-0000000000000000/0000000000 (with /)"; exit 1; }
          [[ "$int" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]] || { echo "::error::ADMOB_INTERSTITIAL_ID must look like ca-app-pub-0000000000000000/0000000000 (with /)"; exit 1; }
          [ "$rew" != "$int" ] || { echo "::error::Rewarded and interstitial ids are the same ad unit"; exit 1; }
          pub() { echo "$1" | sed -E 's/^ca-app-pub-([0-9]{16}).*/pub-\1/'; }
          p=$(pub "$app")
          [ "$(pub "$rew")" = "$p" ] && [ "$(pub "$int")" = "$p" ] || { echo "::error::The three AdMob ids belong to different publisher accounts"; exit 1; }
          case "$app$rew$int" in *3940256099942544*) echo "::error::A Google TEST id is set in the secrets"; exit 1;; esac
          [ "$p" = "$APP_ADS_PUB" ] && echo "publisher $p matches app-ads.txt" || echo "::warning::publisher $p differs from app-ads.txt ($APP_ADS_PUB)"
          for k in app_id:$app rewarded_id:$rew interstitial_id:$int; do
            sed -i "s|<string name=\"admob_${k%%:*}\" translatable=\"false\">[^<]*</string>|<string name=\"admob_${k%%:*}\" translatable=\"false\">${k#*:}</string>|" "$f"
          done
          grep -q 3940256099942544 "$f" && { echo "::error::ads.xml still has test ids"; exit 1; }
          echo "AdMob ids validated and applied"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$KS_PASS" "$KS_PASS" > android/keystore.properties
            echo "release signing enabled"
          else
            echo "::warning::Keystore secrets not set: bundle will be UNSIGNED"
          fi

      - name: Build AAB + APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: quero-ser-streamer-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
