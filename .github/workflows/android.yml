# Builds the Play Store bundle (AAB) + APK for "Quero ser Streamer".
# Secrets (Settings > Secrets and variables > Actions):
#   GOOGLE_SERVICES_JSON        content of google-services.json (Firebase)
#   ANDROID_KEYSTORE_BASE64     upload keystore, base64
#   ANDROID_KEYSTORE_PASSWORD   keystore + key password
#   ADMOB_APP_ID / ADMOB_REWARDED_ID / ADMOB_INTERSTITIAL_ID   real AdMob ids
# Missing secrets fall back to: no Firebase, unsigned bundle, AdMob test ids.
name: Android

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web game into assets
        run: |
          npm ci
          npm run build

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set: building without Firebase"
          fi

      - name: AdMob ids
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          f=android/app/src/main/res/values/ads.xml
          for k in app_id rewarded_id interstitial_id; do
            v=$(eval echo "\$ADMOB_$(echo $k | tr a-z A-Z)")
            if [ -n "$v" ]; then
              sed -i "s|<string name=\"admob_$k\" translatable=\"false\">[^<]*</string>|<string name=\"admob_$k\" translatable=\"false\">$v</string>|" "$f"
              echo "admob_$k set"
            else
              echo "::warning::ADMOB_$(echo $k | tr a-z A-Z) not set: using Google test id"
            fi
          done

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$KS_PASS" "$KS_PASS" > android/keystore.properties
            echo "release signing enabled"
          else
            echo "::warning::Keystore secrets not set: bundle will be UNSIGNED"
          fi

      - name: Build AAB + APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: quero-ser-streamer-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
